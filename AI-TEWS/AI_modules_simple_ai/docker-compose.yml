# Compose for AI (Docker-in-Docker optimized)
version: '3.8'

services:
  p-pick_service:
    restart: always
    image: p-pick_service
    ports:
      - 8000
    build:
      context: ./p-pick_module/service
    env_file:
      - ./.env
    environment:
      - CUDA_VISIBLE_DEVICES=-1
      - TF_CPP_MIN_LOG_LEVEL=3
      - OPENBLAS_NUM_THREADS=1
      - OMP_NUM_THREADS=1
    deploy:
      resources:
        limits:
          memory: 2G
      replicas: 2  # Reduced from 5 to avoid DinD thread limits
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    ulimits:
      nproc: 65535
    networks:
      - sispro-tews_req

  p-pick_nginx:
    restart: always
    build:
      context: ./p-pick_module/nginx
    env_file:
      - ./.env
    ports:
      - ${nginx_port}:80
    depends_on:
      - p-pick_service
    networks:
      - sispro-tews_req
    
  p-pick_consumer:
    restart: always
    build:
      context: ./p-pick_module/consumer
    env_file:
      - ./.env
    environment:
      - nginx_host=p-pick_nginx
      - nginx_port=80
      - OPENBLAS_NUM_THREADS=1
    depends_on:
      - p-pick_nginx
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    ulimits:
      nproc: 65535
    networks:
      - sispro-tews_req
    
  association_module:
    build:
      context: ./association_module
    env_file:
      - ./.env
    environment:
      - OPENBLAS_NUM_THREADS=1
      - OMP_NUM_THREADS=1
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    ulimits:
      nproc: 65535
    networks:
      - sispro-tews_req
    
  phase-arrival_module:
    build:
      context: ./phase-arrival_module
    env_file:
      - ./.env
    environment:
      - OPENBLAS_NUM_THREADS=1
      - OMP_NUM_THREADS=1
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    ulimits:
      nproc: 65535
    networks:
      - sispro-tews_req
    
  locmag_module:
    build:
      context: ./locmag_module
    env_file:
      - ./.env
    environment:
      - OPENBLAS_NUM_THREADS=1
      - OMP_NUM_THREADS=1
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    ulimits:
      nproc: 65535
    networks:
      - sispro-tews_req

networks:
  sispro-tews_req:
    name: sispro-tews_req
    external: true
    