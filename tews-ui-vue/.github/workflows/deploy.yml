name: Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Install and Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Dependencies
        run: bun install

      - name: Build
        run: |
          bun run build
          ls -al ./dist

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: mnovalbs/tews:vue
      
      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST_IP }}
          username: ${{ secrets.SERVER_HOST_USERNAME }}
          password: ${{ secrets.SERVER_HOST_PASSWORD }}
          port: ${{ secrets.SERVER_HOST_PORT }}
          script: |
            docker stop tews-ui
            docker rm tews-ui
            docker pull mnovalbs/tews:vue
            docker run --name tews-ui -d -p 8006:8004 mnovalbs/tews:vue
