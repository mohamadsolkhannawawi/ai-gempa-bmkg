version: '3.8'

services:
  archiving_module:
    build:
      context: ./archiving_module
    env_file:
      - ./.env
    tty: true
    volumes:
      - ${archive_location}:/archive
      - /var/run/docker.sock:/var/run/docker.sock  # Mount Docker socket
    deploy:
      resources:
        limits:
          memory: 20G
      replicas: ${archive_replica_count}  # Scale the service to 7 instances
    restart: unless-stopped
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    ulimits:
      nproc: 65535
    networks: 
      - sispro-tews_network

  record_stream_module:
    build:
      context: ./record_stream_module
    env_file:
      - ./.env
    ports:
      - "38001:8001"
    tty: true
    volumes:
      - ${archive_location}:/archive
    restart: unless-stopped
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    ulimits:
      nproc: 65535
    networks: 
      - sispro-tews_network
  
  controller_module:
    build:
      context: ./controller_module
    env_file:
      - ./.env
    # Override seed credentials from wrapper environment
    environment:
      - INITIAL_ADMIN_USERNAME=${INITIAL_ADMIN_USERNAME}
      - INITIAL_ADMIN_PASSWORD=${INITIAL_ADMIN_PASSWORD}
      - INITIAL_ADMIN_EMAIL=${INITIAL_ADMIN_EMAIL}
      - INITIAL_ADMIN_FULLNAME=${INITIAL_ADMIN_FULLNAME}
      - INITIAL_ADMIN_REGION=${INITIAL_ADMIN_REGION}
      - MONGO_HOST=${MONGO_HOST:-mongodb}
      - MONGO_PORT=${MONGO_PORT:-27017}
      - MONGO_DB_NAME=${MONGO_DB_NAME:-sispro-tews}
      - MONGO_CONNECT_RETRIES=${MONGO_CONNECT_RETRIES:-10}
      - MONGO_CONNECT_RETRY_DELAY=${MONGO_CONNECT_RETRY_DELAY:-3}
      - STATION_CSV=station_indonesia.csv
    ports:
      - "38003:8003"
    tty: true
    restart: unless-stopped
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    ulimits:
      nproc: 65535
    networks: 
      - sispro-tews_network

  # web socket general
  websocket_general:
    build:
      context: ./controller_module
      dockerfile: Dockerfile_general
    env_file:
      - ./.env
    ports:
      - "38005:8005"
    tty: true
    restart: unless-stopped
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    ulimits:
      nproc: 65535
    networks: 
      - sispro-tews_network


  websocket_waveform:
    build:
      context: ./controller_module
      dockerfile: Dockerfile_waveform
    env_file:
      - ./.env
    ports:
      - "38004:8004"  # Map external port to an internal port (for load balancing purposes)
    tty: true
    restart: unless-stopped
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    ulimits:
      nproc: 65535
    networks: 
      - sispro-tews_network
  
  fdsn_module:
    build:
      context: ./fdsn_module
    env_file:
      - ./.env
    tty: true
    volumes:
      - ${archive_location}:/archive
    restart: unless-stopped
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    ulimits:
      nproc: 65535
    networks: 
      - sispro-tews_network
  
  fdsn_api_module:
    build:
      context: ./fdsn_module
      dockerfile: Dockerfile_API
    env_file:
      - ./.env
    ports:
      - "38002:8002"
    tty: true
    volumes:
      - ${archive_location}:/archive
    restart: unless-stopped
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    ulimits:
      nproc: 65535
    networks: 
      - sispro-tews_network

  public_api_module:
    build:
      context: ./api_incoming_module
      dockerfile: Dockerfile
    env_file:
      - ./.env
    ports:
      - "38007:8007"
    tty: true
    restart: unless-stopped
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    ulimits:
      nproc: 65535
    networks: 
      - sispro-tews_network
  
  seedlink_module:
    build:
      context: ./seedlink_module
    env_file:
      - ./.env
    # NOTE: Seedlink is internal scheduler, not exposed to host.
    # Port 18000 used for SeedLink client connections (via Kafka/Redis bridge).
    # Multiple replicas share internal network; no port binding needed.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock  # Mount Docker socket
    tty: true
    deploy:
      resources:
        limits:
          memory: 5G
      replicas: ${seedlink_replica_count} # Scale the service to 5 instances
    restart: unless-stopped
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    ulimits:
      nproc: 65535
    networks: 
      - sispro-tews_network
  
networks:
  # (useful for local deployment)
  sispro-tews_network:
    external: true
    name: sispro-tews_req