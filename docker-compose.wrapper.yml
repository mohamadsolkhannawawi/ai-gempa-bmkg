version: '3.8'

services:
  gempa-wrapper:
    build:
      context: .
      dockerfile: Dockerfile.wrapper
    privileged: true
    container_name: gempa-dind-wrapper
    restart: unless-stopped
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
    ports:
      # Internal service ports (38001-38006) handled inside DinD, not exposed to host
      - "8000:8000"     # AI-TEWS AI modules
      - "8001:8001"     # AI modules
      - "8002:8002"
      - "8003:8003"
      - "8004:8004"
      - "8005:8005"
      - "8006:8006"     # geomecca frontend (existing)
      - "8007:8007"
      - "32717:27017"   # mongodb (avoid K8s conflict)
      - "36379:6379"    # redis (avoid K8s conflict)
      - "39092:9092"    # kafka (avoid K8s conflict)
      - "32181:2181"    # zookeeper (avoid K8s conflict)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /mnt/archive:/mnt/archive
      - ./sispro-tews:/app/sispro-tews
      - ./AI-TEWS:/app/AI-TEWS
      - ./tews-ui-vue:/app/tews-ui-vue
      - ./.envs:/app/.envs
      - gempa-docker-data:/var/lib/docker
      - gempa-logs:/var/log/gempa
    # Load seed credentials from env file
    env_file:
      - .env.seed
    environment:
      - DISPLAY=${DISPLAY}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      # Pass seed env vars to inner containers (exported by entrypoint)
      - INITIAL_ADMIN_USERNAME=${INITIAL_ADMIN_USERNAME}
      - INITIAL_ADMIN_PASSWORD=${INITIAL_ADMIN_PASSWORD}
      - INITIAL_ADMIN_EMAIL=${INITIAL_ADMIN_EMAIL:-admin@bmkg.go.id}
      - INITIAL_ADMIN_FULLNAME=${INITIAL_ADMIN_FULLNAME:-Administrator BMKG}
      - INITIAL_ADMIN_REGION=${INITIAL_ADMIN_REGION:-Indonesia}
      - MONGO_HOST=${MONGO_HOST:-mongodb}
      - MONGO_PORT=${MONGO_PORT:-27017}
      - MONGO_DB_NAME=${MONGO_DB_NAME:-sispro-tews}
      - MONGO_CONNECT_RETRIES=${MONGO_CONNECT_RETRIES:-10}
      - MONGO_CONNECT_RETRY_DELAY=${MONGO_CONNECT_RETRY_DELAY:-3}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: ["/app/entrypoint-wrapper.sh"]
    ulimits:
      nproc: 65535
      nofile:
        soft: 65535
        hard: 65535

volumes:
  gempa-docker-data:
  gempa-logs:
